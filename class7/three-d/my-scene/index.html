<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>星球宇宙</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #tip  { position: fixed; left: 16px; top: 12px; color: #cfe8ff; font: 14px sans-serif; pointer-events: none; }
    #info { position: fixed; left: 16px; bottom: 14px; color: #ffd54f; font: bold 16px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <div id="tip">第二步·主体：拖拽旋转 · 滚轮缩放 · 已加入太阳/地球/月球/土星</div>
  <div id="info"></div>

  <script src="../libs/three.min.js"></script>
  <script src="../libs/OrbitControls.js"></script>
  <script>
    // ==================== 第一步：环境搭建 ====================
    // （第三步：公转动画 + 点击交互 —— 待续）

    // 场景：深空背景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070f);

    // 相机：45° 透视
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 5, 11);

    // 渲染器：开启抗锯齿
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // 轨道控制：鼠标拖拽旋转 + 滚轮缩放（带阻尼更顺滑）
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 3;
    controls.maxDistance = 30;

    // 光源：微弱环境光 + 太阳位置的点光源（太阳本体第二步加入）
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));
    const sunLight = new THREE.PointLight(0xfff2c0, 1.8, 40);
    scene.add(sunLight);

    // 星空：1200 个点粒子随机铺满大球壳
    const starGeo = new THREE.BufferGeometry();
    const starPos = [];
    for (let i = 0; i < 1200; i++) {
      const r = 40 + Math.random() * 50;                 // 半径 40~90
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);      // 均匀球面分布
      starPos.push(
        r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18 }));
    scene.add(stars);

    // ==================== 第二步：天体主体（3 类以上不同对象/材质）====================

    // 太阳：MeshBasicMaterial 不受光照，呈现"自己发光"
    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(1.1, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffcc33 })
    );
    sun.userData.name = '太阳';
    scene.add(sun);

    // 地球公转组：组心在太阳处，旋转整组即公转；略微倾斜更自然
    const earthPivot = new THREE.Group();
    earthPivot.rotation.x = 0.08;
    scene.add(earthPivot);

    // 地球：MeshStandardMaterial 受光，有昼夜面
    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x42a5f5, roughness: 0.6 })
    );
    earth.position.set(3.4, 0, 0);
    earth.userData.name = '地球';
    earthPivot.add(earth);

    // 月球公转组：挂在地球位置，跟随地球公转又能独立绕地
    const moonPivot = new THREE.Group();
    moonPivot.position.copy(earth.position);
    earthPivot.add(moonPivot);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 24, 24),
      new THREE.MeshStandardMaterial({ color: 0xbdbdbd, roughness: 0.9 })
    );
    moon.position.set(0.95, 0, 0);
    moon.userData.name = '月球';
    moonPivot.add(moon);

    // 土星公转组（倾斜角度更大，突出环的立体感）
    const saturnPivot = new THREE.Group();
    saturnPivot.rotation.x = 0.18;
    scene.add(saturnPivot);

    const saturn = new THREE.Mesh(
      new THREE.SphereGeometry(0.85, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0xffb74d, roughness: 0.8 })
    );
    saturn.position.set(6.2, 0, 0);
    saturn.userData.name = '土星';
    saturnPivot.add(saturn);

    // 土星环：TorusGeometry 圆环（与球体不同的几何体），绕 X 轴躺平
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.25, 0.06, 16, 80),
      new THREE.MeshStandardMaterial({ color: 0xd7a86b, roughness: 0.7 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.userData.name = '土星环';
    saturn.add(ring);

    // 轨道辅助圈：细半透明圆环标出公转路径
    [3.4, 6.2].forEach(r => {
      const orbit = new THREE.Mesh(
        new THREE.TorusGeometry(r, 0.008, 8, 128),
        new THREE.MeshBasicMaterial({ color: 0x3a5a80, transparent: true, opacity: 0.5 })
      );
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);
    });

    // 动画循环（第三步动画在此扩展）
    const animate = () => {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    };
    animate();

    // 窗口 resize 适配
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
