<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书收藏</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 600px; margin: 24px auto; padding: 0 16px; }
    .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .add-form input { padding: 6px 8px; flex: 1 1 120px; }
    .add-form button { padding: 6px 16px; cursor: pointer; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; margin: 8px 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
    li .title { font-weight: bold; }
    li .meta { color: #666; font-size: 14px; }
    li .rating { color: #e67e22; font-weight: bold; }
    .del { margin-left: auto; cursor: pointer; color: #c00; border: none; background: none; }
    .edit { cursor: pointer; color: #2980b9; border: none; background: none; }
  </style>
</head>
<body>
  <h1>图书收藏</h1>
  <form id="add-form" class="add-form">
    <input type="text" id="book-title" placeholder="书名">
    <input type="text" id="book-author" placeholder="作者">
    <input type="number" id="book-rating" placeholder="评分(0-10)" min="0" max="10" step="0.1">
    <button type="submit">添加</button>
  </form>
  <p class="tip" id="tip"></p>
  <ul id="book-list"></ul>
  <script src="app.js"></script>
</body>
</html>
