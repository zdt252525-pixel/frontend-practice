<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园探索 · 三维导览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: "Microsoft YaHei", sans-serif; }
        #scene-container { width: 100vw; height: 100vh; background: #87CEEB; }
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.75);
            color: white; padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
        }
        .top-bar a {
            color: #fff; text-decoration: none;
            padding: 6px 14px; background: #1a2a6c; border-radius: 4px;
        }
        .top-bar a:hover { background: #2c3e8c; }
        .info-panel {
            position: fixed; bottom: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.92);
            padding: 16px; border-radius: 10px;
            max-width: 280px; z-index: 100;
            box-shadow: 0 4px 14px rgba(0,0,0,.18);
        }
        .info-panel h4 { margin-bottom: 8px; color: #1a2a6c; }
        .info-panel p { font-size: 14px; color: #333; line-height: 1.7; }
        .legend {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.75); color: white;
            padding: 12px 16px; border-radius: 8px; font-size: 13px; z-index: 100;
        }
        .legend span { display: inline-block; width: 12px; height: 12px;
                       margin-right: 6px; border-radius: 2px; }
    </style>
</head>
<body>
    <div id="scene-container"></div>

    <div class="top-bar">
        <h3>🌐 校园三维导览</h3>
        <a href="index.html">← 返回首页</a>
    </div>

    <div class="info-panel">
        <h4>🏫 操作指南</h4>
        <p>鼠标左键拖动：旋转视角<br>
        鼠标滚轮：缩放<br>
        鼠标右键拖动：平移</p>
    </div>

    <div class="legend">
        <div><span style="background:#E53935"></span>主教学楼</div>
        <div><span style="background:#1E88E5"></span>图书馆</div>
        <div><span style="background:#43A047"></span>实验楼</div>
        <div><span style="background:#FB8C00"></span>行政楼</div>
        <div><span style="background:#8D6E63"></span>食堂/宿舍</div>
    </div>

    <!-- Three.js r128（OrbitControls CDN 可用） -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="js/scene.js"></script>
</body>
</html>
