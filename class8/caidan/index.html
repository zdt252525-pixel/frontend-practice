<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园探索 · 个人技术整合</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
        }
        /* Hero 横幅 */
        .hero {
            background: linear-gradient(135deg, #1a2a6c 0%, #b21f1f 50%, #fdbb2d 100%);
            color: #fff;
            padding: 90px 0 70px;
            margin-bottom: 50px;
        }
        .hero h1 { font-weight: 700; letter-spacing: 2px; }
        /* 模块卡片 */
        .module-card {
            border: none;
            border-radius: 12px;
            transition: transform .3s, box-shadow .3s;
            cursor: pointer;
            height: 100%;
        }
        .module-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 36px rgba(0,0,0,.18);
        }
        /* 章节标题 */
        .sec-title {
            border-left: 5px solid #1a2a6c;
            padding-left: 14px;
            margin-bottom: 24px;
        }
        /* 占位框 */
        .ph-box {
            background: #fff;
            border: 2px dashed #c9ccd1;
            border-radius: 10px;
            padding: 50px;
            text-align: center;
            color: #868e96;
        }
        /* 页脚 */
        footer {
            background: #212529;
            color: #adb5bd;
            padding: 24px 0;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#home">🏫 校园探索</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="#explore">探索</a></li>
                    <li class="nav-item"><a class="nav-link" href="#stats">统计</a></li>
                    <li class="nav-item"><a class="nav-link" href="scene.html">三维</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section id="home" class="hero text-center">
        <div class="container">
            <h1 class="display-4">校园探索平台</h1>
            <p class="lead mt-3 opacity-90">发现校园地标 · 浏览建筑数据 · 三维沉浸式导览</p>
        </div>
    </section>

    <!-- 模块卡片区 -->
    <section class="container mb-5">
        <div class="row g-4">
            <div class="col-md-3 col-sm-6">
                <div class="card module-card text-center" onclick="location.href='#explore'">
                    <div class="card-body p-4">
                        <h2 class="text-primary">🔎</h2>
                        <h5 class="mt-2">校园探索</h5>
                        <p class="text-muted small">按类型/楼层筛选建筑</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card module-card text-center" onclick="location.href='#stats'">
                    <div class="card-body p-4">
                        <h2 class="text-success">📈</h2>
                        <h5 class="mt-2">数据统计</h5>
                        <p class="text-muted small">ECharts 可视化图表</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card module-card text-center" onclick="location.href='scene.html'">
                    <div class="card-body p-4">
                        <h2 class="text-warning">🌐</h2>
                        <h5 class="mt-2">三维导览</h5>
                        <p class="text-muted small">Three.js 沉浸场景</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-sm-6">
                <div class="card module-card text-center">
                    <div class="card-body p-4">
                        <h2 class="text-info">📘</h2>
                        <h5 class="mt-2">关于项目</h5>
                        <p class="text-muted small">个人技术整合作业</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 探索区块（占位） -->
    <section id="explore" class="container mb-5">
        <h2 class="sec-title">校园探索</h2>
        <div class="ph-box">
            <h5>🔎 探索模块</h5>
            <p>第二步：筛选器 + 建筑卡片列表</p>
        </div>
    </section>

    <!-- 统计区块（占位） -->
    <section id="stats" class="container mb-5">
        <h2 class="sec-title">数据统计</h2>
        <div class="ph-box">
            <h5>📈 统计模块</h5>
            <p>第二步：ECharts 柱状图 + data.json 数据</p>
        </div>
    </section>

    <!-- 页脚 -->
    <footer>
        <div class="container text-center">
            <small>© 2026 校园探索 · 期末大作业原型</small>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
